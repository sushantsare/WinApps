<linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#36d1c4"/><stop offset="1" stop-color="#0a8f8a"/></linearGradient>
<filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#002a5c" flood-opacity=".28"/></filter>
</defs>
  <circle cx="128" cy="128" r="100" fill="url(#b)" filter="url(#s)"/>
  <path d="M78 128 a50 50 0 0 1 86 -35" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
  <path d="M178 128 a50 50 0 0 1 -86 35" fill="none" stroke="#bfe0ff" stroke-width="16" stroke-linecap="round"/>
  <path d="M170 66 v32 h-32" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M86 190 v-32 h32" fill="none" stroke="#bfe0ff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="tx"><div>App Store</div><div class="ds">Version 1.0.0 · Developed by Sushant Kumar · <a href="mailto:sushant.sare@gmail.com">sushant.sare@gmail.com</a></div></div><button class="btn sub">What's new ${ic('chev',14)}</button></div></div>`;
}
function render(){
 $('#nav').innerHTML=navHTML();
 const P={installed:installedHTML,updates:updatesHTML,search:searchHTML,queue:queueHTML,history:historyHTML,settings:settingsHTML};
 $('#page').innerHTML=P[S.page]();
 const q=$('#q'); if(q){q.oninput=e=>{S.q=e.target.value;const pos=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos);};}
 const ts=$('#themeSel'); if(ts){ts.value=document.body.classList.contains('dark')?'Dark':'Light';ts.onchange=e=>{document.body.classList.toggle('dark',e.target.value==='Dark');};}
 adapt();
}
function toast(msg){$('#layer').innerHTML=`<div class="toast infobar ok card">${ic('check',16,'var(--ok)',2.2)}<span>${msg}</span></div>`;setTimeout(()=>{if($('.toast'))$('#layer').innerHTML=''},2600);}
function dialog(title,body,okLabel,ok){
 $('#layer').innerHTML=`<div class="ovl"><div class="dlg" role="dialog" aria-modal="true"><div class="b"><div class="h2" style="margin-bottom:10px">${title}</div><div style="line-height:1.55">${body}</div></div><div class="f"><button class="btn pri" style="flex:1" id="dok">${okLabel}</button><button class="btn" style="flex:1" id="dno">Cancel</button></div></div></div>`;
 $('#dok').focus(); $('#dok').onclick=()=>{$('#layer').innerHTML='';ok();}; $('#dno').onclick=()=>$('#layer').innerHTML='';
}
function enqueue(items){S.queue.push(...items);S.page='queue';S.showDet=false;render();tick();}
let timer=null;
function tick(){ if(timer) return; timer=setInterval(()=>{
 if(!S.queue.length){clearInterval(timer);timer=null;render();return;}
 const x=S.queue[0]; x.p=Math.min(100,(x.p||0)+12);
 if(x.p>=100){S.queue.shift();S.done.unshift({n:x.n,col:x.col,txt:x.kind==='uni'?'Uninstalled':(x.kind==='upd'?'Updated to ':'Installed ')+x.v});
  S.history.unshift({day:'Today',n:x.n,col:x.col,act:x.kind==='upd'?'Updated':x.kind==='uni'?'Uninstalled':'Installed',det:x.v,tm:new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}),k:'ok'});
  if(x.kind==='upd') S.updates=S.updates.filter(u=>u.id!==x.id); else if(x.kind==='uni'){S.inst=S.inst.filter(i=>i.id!==x.id);S.uticks.delete(x.id);} else S.installed.add(x.id);
  if(!S.queue.length) toast('All done — '+S.done.length+' finished');}
 if(['queue','updates','search','history'].includes(S.page)) render(); else $('#nav').innerHTML=navHTML();
},350);}
const adminLine=()=>S.admin?'<div class="infobar" style="margin-top:14px;font-size:13px">'+ic('shield',16,'var(--accent)')+'<span>Windows will ask for admin permission <b>once</b> for the whole batch.</span></div>':'<div class="mut" style="margin-top:12px;font-size:13px">Some apps may show their own Windows permission popup.</div>';
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-opts],[data-seli],[data-ticki],[data-nav],[data-act],[data-ticku],[data-selu],[data-ticks],[data-sels],[data-inst],[data-tog],[data-recent],[data-cancel],#hamb');
 if(!t) { if($('#win').classList.contains('navopen')&&!e.target.closest('#nav')) {$('#win').classList.remove('navopen');} return; }
 const d=t.dataset;
 if(t.id==='hamb'){$('#win').classList.toggle('navopen');return;}
 if(d.opts){e.stopPropagation();optsDialog(d.opts);return;}
 if(d.ticki){e.stopPropagation();S.uticks.has(d.ticki)?S.uticks.delete(d.ticki):S.uticks.add(d.ticki);render();return;}
 if(d.seli){S.selI=d.seli;S.showDet=$('#win').offsetWidth<1008;render();return;}
 if(d.nav){S.page=d.nav;S.showDet=false;$('#win').classList.remove('navopen');render();return;}
 if(d.ticku!==undefined){e.stopPropagation();const u=S.updates[+d.ticku];u.on=!u.on;render();return;}
 if(d.selu!==undefined){S.selU=+d.selu;S.showDet=isNarrow();render();return;}
 if(d.ticks){e.stopPropagation();S.ticks.has(d.ticks)?S.ticks.delete(d.ticks):S.ticks.add(d.ticks);render();return;}
 if(d.sels){S.selS=d.sels;S.showDet=isNarrow()&&!e.target.closest('[data-inst]');render();return;}
 if(d.inst){e.stopPropagation();const x=D.search.find(s=>s.id===d.inst);dialog('Install '+x.n+'?',x.n+' '+x.ver+' from winget will be installed silently.'+adminLine(),'Install',()=>{S.ticks.delete(x.id);enqueue([{...x,v:x.ver,kind:'ins',p:0}]);});return;}
 if(d.recent){S.q=d.recent;render();return;}
 if(d.tog){S[d.tog]=!S[d.tog];render();return;}
 if(d.cancel!==undefined){S.queue.splice(+d.cancel,1);render();return;}
 const a=d.act;
 if(a==='check'||a==='retry'){S.state='loading';$('#stateSel').value='loading';render();setTimeout(()=>{S.state='normal';$('#stateSel').value='normal';render();},1400);}
 if(a==='fix'){S.state='loading';render();setTimeout(()=>{S.state='normal';$('#stateSel').value='normal';render();toast('winget repaired');},1600);}
 if(a==='navtoggle'){if($('#win').classList.contains('minimal')){$('#win').classList.remove('navopen');return;}S.navOpen=!S.navOpen;try{localStorage.setItem('as-nav',S.navOpen?'open':'closed')}catch(e){}render();}
 if(a==='ignore'){const u=S.updates[S.selU];dialog('Ignore all updates for '+u.n+'?','App Store will never show updates for this app. Undo anytime in Settings › Ignored apps or in its Install options.','Ignore app',()=>{S.ignored.push(u.n);S.opts[u.id]={...(S.opts[u.id]||{}),ignore:true};S.updates.splice(S.selU,1);S.selU=0;render();toast(u.n+' ignored');});}
 if(a==='unignore'){S.ignored=[];Object.values(S.opts).forEach(o=>o.ignore=false);render();toast('Ignored apps will show updates again');}
 if(a==='heldinst'){const h=S.held.shift();enqueue([{...h,v:h.new,kind:'upd',p:0}]);}
 if(a==='uclear'){S.uticks.clear();render();}
 if(a==='uninstsel'||a==='uninst1'){const ids=a==='uninst1'?[S.selI]:[...S.uticks];const xs=S.inst.filter(x=>ids.includes(x.id));dialog(`Uninstall ${xs.length===1?xs[0].n:xs.length+' apps'}?`,xs.map(x=>x.n).join(', ')+' will be removed from this PC.'+adminLine(),'Uninstall',()=>{enqueue(xs.map(x=>({...x,v:x.ver,kind:'uni',p:0})));});}
 if(a==='export'){toast('App list exported to Documents\AppStore-list.json');}
 if(a==='import'){dialog('Import app list','AppStore-list.json · 38 apps<br><span class="mut">In the real app you tick which ones to install.</span>','Install 38 apps',()=>toast('38 apps added to the queue'));}
 if(a==='clearhist'){dialog('Clear history?','All history entries will be deleted. This can’t be undone.','Clear history',()=>{S.history=[];render();});}
 if(a==='resetsrc'){toast('winget sources reset');}
 if(a==='tickall'){const all=S.updates.every(u=>u.on);S.updates.forEach(u=>u.on=!all);render();}
 if(a==='updall'){const sel=S.updates.filter(u=>u.on);dialog(`Update ${sel.length} app${sel.length>1?'s':''}?`,sel.map(s=>s.n).join(', ')+' will update one after another.'+(sel.some(s=>S.running.has(s.id))?'<div class="infobar" style="margin-top:14px;font-size:13px;background:var(--warnbg)">'+ic('warn',16,'var(--warn)')+'<span><b>'+sel.filter(s=>S.running.has(s.id)).map(s=>s.n).join(', ')+'</b> is open. It will be closed before updating.</span></div>':'')+adminLine(),`Update ${sel.length} app${sel.length>1?'s':''}`,()=>enqueue(sel.map(s=>({...s,v:s.new,kind:'upd',p:0}))));}
 if(a==='upd1'){const u=S.updates[S.selU];enqueue([{...u,v:u.new,kind:'upd',p:0}]);}
 if(a==='skip'){const u=S.updates[S.selU];dialog('Skip '+u.n+' '+u.new+'?','You won\'t be offered this version again. A newer version will still show up. Undo anytime in Settings.','Skip version',()=>{S.skipped.push({n:u.n,v:u.new});S.updates.splice(S.selU,1);S.selU=0;S.history.unshift({day:'Today',n:u.n,col:u.col,act:'Skipped version',det:u.new,tm:'now',k:'skip'});render();toast(u.n+' '+u.new+' skipped');});}
 if(a==='unskip'){S.skipped=[];render();toast('Skipped updates will show again');}
 if(a==='clear'){S.ticks.clear();render();}
 if(a==='instsel'){const sel=D.search.filter(s=>S.ticks.has(s.id));dialog(`Install ${sel.length} apps?`,sel.map(s=>s.n).join(', ')+' will install one after another.'+adminLine(),`Install ${sel.length} apps`,()=>{S.ticks.clear();enqueue(sel.map(s=>({...s,v:s.ver,kind:'ins',p:0})));});}
 if(a==='cancelall'){S.queue=[];render();}
 if(a==='closedet'){S.showDet=false;render();}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){$('#layer').innerHTML='';if(S.showDet){S.showDet=false;render();}}
 if(e.key==='F5'){e.preventDefault();S.page='updates';document.querySelector('[data-act=check]')?.click();}
 if(e.ctrlKey&&e.key.toLowerCase()==='f'){e.preventDefault();S.page='search';render();$('#q')?.focus();}
 if(e.ctrlKey&&e.key===','){e.preventDefault();S.page='settings';render();}
 if((e.key==='Enter'||e.key===' ')&&e.target.classList?.contains('row')){e.preventDefault();e.target.click();}
});
const isNarrow=()=>$('#win').offsetWidth<1008;
let lastW=0;function adapt(){const w=$('#win').offsetWidth,W=$('#win');if(lastW>=1008&&w<1008)S.navOpen=false;if(lastW&&lastW<1008&&w>=1008)S.navOpen=true;lastW=w;W.classList.toggle('minimal',w<641);W.classList.toggle('compact',w>=641&&!S.navOpen);W.classList.toggle('narrow',w<1008);}
new ResizeObserver(adapt).observe(document.getElementById('win'));
$('#wsel').onchange=e=>{$('#win').style.width=e.target.value;setTimeout(render,50);};
$('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');render();};
$('#stateSel').onchange=e=>{S.state=e.target.value;S.page='updates';if(S.state==='normal'&&!S.updates.length)S.updates=D.apps.map((a,i)=>({...a,on:i<5}));render();};
if(matchMedia('(prefers-color-scheme: dark)').matches) document.body.classList.add('dark');
render();
</script></body></html>
